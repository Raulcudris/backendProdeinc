plugins {
	id 'org.springframework.boot' version '2.7.1'
	id 'io.spring.dependency-management' version '1.0.11.RELEASE'
	id 'java'
}

group = 'com.system'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '11'

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2021.0.4")
}

dependencies {
	// Core Spring Cloud
	implementation 'org.springframework.cloud:spring-cloud-starter-config'
	implementation 'org.springframework.cloud:spring-cloud-starter-bootstrap:3.1.3'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway'

	// Firebase para autenticación
	implementation 'com.google.firebase:firebase-admin:8.1.0'
	// Si lo necesitas explícitamente, descomenta:
	// implementation 'org.json:json:20230227'

	// JWT para super usuario interno del Gateway
	implementation 'io.jsonwebtoken:jjwt:0.9.1'

	// Necesario para jjwt 0.9.1 con Java 11
	implementation 'javax.xml.bind:jaxb-api:2.3.1'

	// Monitoreo y salud
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// gRPC (si lo usas en filtros o clientes internos)
	implementation 'io.grpc:grpc-netty:1.66.0'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Testing
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

// Prepara JAR para contenedor
bootJar {
	launchScript()
}
