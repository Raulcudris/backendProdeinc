version: '3.8'
services:
  srv_system_eureka:
    build:
      context: ../  # Contexto del build, cambia a la carpeta system-eureka
      dockerfile: Docker/Dockerfile
    container_name: msvc_system_eureka
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    ports:
      - "8761:8761"
    restart: always
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: 0.5
        reservations:
          memory: 1024M
          cpus: 0.5
    networks:
      - docker_default

networks:
  docker_default:
    external: true