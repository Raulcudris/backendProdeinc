version: '3.8'
services:
  srv_system_config:
    build:
      context: ../  # Contexto del build, cambia a la carpeta system_config
      dockerfile: Docker/Dockerfile
    container_name: msvc_system_config
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    ports:
      - "8089:8089"
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: 0.5
        reservations:
          memory: 512M
          cpus: 0.5
    networks:
      - docker_default

networks:
  docker_default:
    external: true

                  