version: '3.8'  # versión 3.8 para asegurar compatibilidad con la sección de "deploy"
services:
  srv_system_users:
    build:
      context: ../  # Contexto del build, cambia a la carpeta system-users
      dockerfile: Docker/Dockerfile
    container_name: msvc_system_users
    ports:
      - "6078:6078"
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    restart: always
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: 0.2
        reservations:
          memory: 512M
          cpus: 0.2
    networks:
      - docker_default

networks:
  docker_default:
    external: true


