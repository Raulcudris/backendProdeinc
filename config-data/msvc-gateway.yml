server:
  port: 8088

eureka:
  client:
    fetch-registry: true
    register-with-eureka: false
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true

      routes:

        - id: offers-services
          uri: lb://msvc-offers
          predicates:
            - Path=/api/offers/**

